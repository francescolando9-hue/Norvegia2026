# Pubblica l'app su GitHub Pages a ogni push su main.
# Da attivare una volta sola: Settings -> Pages -> Source: GitHub Actions.

name: Pubblica su Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la sintassi dei moduli
        run: |
          for f in data.js store.js ui.js weather.js views.js app.js sw.js; do
            node --check "$f"
          done

      - name: Controlla che la cache del service worker sia allineata
        run: |
          python3 build.py --check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  pubblica:
    needs: verifica
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
